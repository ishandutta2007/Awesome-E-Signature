<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="penGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#a855f7"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes float{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(1deg)}}@keyframes pulseGrid{0%{opacity:.15}50%{opacity:.35}}@keyframes dashSign{0%{stroke-dashoffset:600}50%{stroke-dashoffset:0}}.bg-grid{animation:pulseGrid 6s ease-in-out infinite}.floating-card{animation:float 5s ease-in-out infinite}.signature-path{stroke-dasharray:600;stroke-dashoffset:600;animation:dashSign 8s ease-in-out infinite}</style></defs><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><g stroke="#6366f1" stroke-width="1" class="bg-grid"><path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200 M0 240 H1200 M0 280 H1200" opacity=".3"/><path d="M100 0 V320 M200 0 V320 M300 0 V320 M400 0 V320 M500 0 V320 M600 0 V320 M700 0 V320 M800 0 V320 M900 0 V320 M1000 0 V320 M1100 0 V320" opacity=".3"/></g><path fill="none" stroke="url(#textGrad)" stroke-width="4" d="M 750 210 Q 820 140 860 210 T 940 180 T 1020 220 T 1100 160" class="signature-path" opacity=".6"/><circle cx="1050" cy="80" r="90" fill="#a855f7" filter="url(#glow)" opacity=".15"/><circle cx="150" cy="240" r="110" fill="#0284c7" filter="url(#glow)" opacity=".15"/><g class="floating-card" transform="translate(80, 75)"><rect width="84" height="84" fill="#1e293b" stroke="url(#textGrad)" stroke-width="2.5" filter="url(#glow)" rx="20"/><path fill="url(#penGrad)" d="M28 56 L56 28 L64 36 L36 64 Z M24 64 L32 64 L24 56 Z M48 20 L56 12 L68 24 L60 32 Z"/></g><g><text x="0" y="115" fill="url(#textGrad)" filter="url(#glow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" transform="translate(190, 0)">Awesome E-Signature ✒️</text><text x="0" y="160" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" transform="translate(190, 0)">Curated SaaS Platforms, Open-Source Solutions &amp; PKI Signing Libraries</text><g transform="translate(190, 0) translate(0, 195)"><rect width="130" height="32" fill="#334155" stroke="#475569" stroke-width="1" rx="16"/><text x="65" y="21" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">💼 Commercial SaaS</text><rect width="135" height="32" x="142" fill="#334155" stroke="#475569" stroke-width="1" rx="16"/><text x="209" y="21" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Self-Hostable</text><rect width="145" height="32" x="289" fill="#334155" stroke="#475569" stroke-width="1" rx="16"/><text x="361.5" y="21" fill="#c084fc" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔒 Audit &amp; Legal</text></g></g></svg>